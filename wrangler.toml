name = "findmerates"
main = "src/worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[env.production]
name = "findmerates"

[env.staging]
name = "findmerates-staging"

# Build configuration
[build]
command = "npm run build"
cwd = "."
upload_dir = "dist"

# Environment variables
[vars]
NODE_ENV = "production"

# KV Namespaces (if needed)
# [[kv_namespaces]]
# binding = "KV_NAMESPACE"
# id = "your-kv-namespace-id"

# D1 Database (if needed)
# [[d1_databases]]
# binding = "DB"
# database_name = "findmerates-db"
# database_id = "your-database-id"
